[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

# The native accelerator: rust/xlspy_core, a PyO3 module (see _accel.py).
[tool.maturin]
python-source = "src"
module-name = "xlspy._rs_core"
manifest-path = "rust/xlspy_core/Cargo.toml"
# Not in Cargo.toml, so `cargo test` links against libpython.
features = ["pyo3/extension-module"]
# Editable installs would otherwise build the debug profile (several times slower).
profile = "release"

[project]
name = "xlspy"
version = "0.15.0"
authors = [
  { name="Krzysztof Duśko"},
]
description = "Read and write XLSB and XLSX files efficiently, including XLSM updates."
keywords = [
    "excel",
    "xlsx",
    "xlsb",
    "xlsm",
    "spreadsheet",
    "python",
    "rust",
    "pandas",
    "polars",
    "excel-reader",
    "excel-writer",
    "dataframes",
    "streaming",
    "high-performance",
    "excel-automation",
    "report-generation",
]
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Rust",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Office Suites",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
]

[project.urls]
Repository = "https://github.com/justybase/xlspy/"
Documentation = "https://justybase.github.io/xlspy/"
Changelog = "https://github.com/justybase/xlspy/blob/main/CHANGELOG.md"
Issues = "https://github.com/justybase/xlspy/issues"

[project.optional-dependencies]
pandas = [
    "pandas>=2.0",
]
polars = [
    "polars>=1.0",
]
test = [
    "openpyxl==3.1.5",  # the openpyxl_compat goldens were made with it
    "pandas",
    "polars",
    "pytest",
    "pytest-cov",
    "pytest-randomly",
    "pytest-timeout",
    "hypothesis",
    "psutil",
    "pyxlsb",  # a second XLSB reader (tests/test_xlsb_interop.py)
    "xlsxwriter",
]
examples = [
    "memory-profiler"
]
# The guide and API reference site (mkdocs.yml, built with Zensical); CI installs the same versions.
docs = [
    "zensical>=0.1",
    "mkdocstrings-python>=1.0",
]

# The architectures come from the runner (CIBW_ARCHS in .github/workflows/publish.yml).
[tool.cibuildwheel]
build = "cp311-* cp312-* cp313-* cp314-* cp315-*"

# Rust's standard library needs macOS 10.12 on x86_64 (arm64 starts at 11.0), so
# the wheels claim 10.12, not the 10.9 of the CPython 3.11 build; delocate refuses
# a wheel whose tag promises less than its extension needs.
[tool.cibuildwheel.macos]
environment = { MACOSX_DEPLOYMENT_TARGET = "10.12" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers --strict-config"
# A hung test (an Excel dialog, a native loop) fails instead of stalling CI.
timeout = 300
markers = [
    "com: requires Microsoft Excel via COM; skipped unless XLSPY_RUN_EXCEL_COM=1",
    "printer: reads or sets Excel's PageSetup, which needs a reachable default printer; skipped unless XLSPY_RUN_EXCEL_PRINT=1",
    "libreoffice: converts output with headless LibreOffice; skipped when soffice is not found",
    "compat: openpyxl compatibility harness and golden workbooks (tests/openpyxl_compat)",
]
filterwarnings = [
    "error",
]

[tool.coverage.run]
source = ["src/xlspy"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
# CI combines a native run and an XLSPY_ACCEL=python run. Both together reach
# 92% branch coverage (2026-11-20, with pandas/polars installed); the floor is
# two points under that. Only explicit pragma: no cover lines are excluded.
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]

[tool.ruff]
src = ["src"]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
# Correctness checks: syntax errors, undefined names, unused imports and
# variables, plus rules that report nothing (or were fixed to report nothing).
# UP keeps the syntax current for Python 3.11 (builtin generics, X | None).
# B/SIM and C901 are the quality ratchet: new code must keep them clean. The
# known debt is listed in per-file-ignores or ignored for an explicit reason.
select = [
    "E9", "F63", "F7", "F82", "F401", "F811", "F841",
    "PLE", "PIE", "TRY203", "C4", "RET", "B010", "B023", "UP", "I002",
    "B", "SIM", "C901",
]
# printf-style formatting is fine where it is used.
ignore = [
    "UP031",
    # Deferred: zip(strict=) changes behavior for unequal lengths; some loop
    # variables are read after the loop.
    "B905", "B007",
    # Explicit try/except/pass in cleanup code is clearer than contextlib.suppress.
    "SIM105",
    # if/else blocks read better than nested ternaries in this code base.
    "SIM108", "SIM102", "SIM114",
    # SpooledTemporaryFile and nested with blocks stay explicit for streaming.
    "SIM115", "SIM117",
    # `if 0 < len(...)` is used deliberately in the reference parser.
    "SIM300",
]
[tool.ruff.lint.mccabe]
# The ratchet: functions above this are listed in per-file-ignores below and
# should lose their entry as they are split.
max-complexity = 20

[tool.ruff.lint.isort]
# Annotations are never evaluated at runtime in the package (I002 adds the import).
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.per-file-ignores]
"src/xlspy/__init__.py" = ["F401"]
"{tests,tools,benchmarks,examples}/**" = ["I002"]
# The lambdas read Excel COM properties and are called at once, inside the loop.
"tests/test_excel_com_xlsb_parity.py" = ["B023", "B018"]
# Blind exception assertions and COM attribute probes are deliberate here.
"tests/test_dataframe.py" = ["B017"]
"tests/test_excel_com_xlsb_loaded.py" = ["B017", "B018"]
"tests/test_reader.py" = ["B011", "B017"]
# Windows environment variable names are case-insensitive; the spelling is the point.
"tests/test_libreoffice_xlsb.py" = ["SIM112"]
# Known complexity debt: remove an entry when the listed functions are split.
"src/xlspy/_xlsb_read.py" = ["C901"]
"src/xlspy/biff_reader.py" = ["C901"]
"src/xlspy/pivots.py" = ["C901"]
"src/xlspy/workbook/_styles.py" = ["C901"]
"src/xlspy/workbook/_xlsb_reader.py" = ["C901"]
"src/xlspy/workbook/_xlsb_tables.py" = ["C901"]
"tests/test_edit_sequences_fuzz.py" = ["C901"]
"tools/bench_styles.py" = ["C901"]

[tool.mypy]
python_version = "3.11"
files = ["src/xlspy"]
mypy_path = ["src"]
ignore_missing_imports = true
warn_unused_configs = true
# Check the bodies of unannotated functions too; without this, mypy skips them.
check_untyped_defs = true
warn_unused_ignores = true
strict_equality = true
warn_return_any = true
no_implicit_reexport = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

# Not yet fully annotated: the bodies are still checked (check_untyped_defs), but
# a def may lack parameter or return types. Every other module, and every new one,
# must annotate each def. Remove a module from this list once it passes.
[[tool.mypy.overrides]]
module = [
    "xlspy._accel",
    "xlspy._output",
    "xlspy._widths",
    "xlspy._xlsb_cf",
    "xlspy._xlsb_formulas",
    "xlspy._xlsx_writer_sheet",
    "xlspy._xlsx_writer_sheet_xml",
    "xlspy._xlsx_writer_styles",
    "xlspy.biff_reader",
    "xlspy.chart_parts",
    "xlspy.pivots",
    "xlspy.workbook._loaded",
    "xlspy.workbook._objects",
    "xlspy.workbook._reader",
    "xlspy.workbook._styles",
    "xlspy.workbook._tables",
    "xlspy.workbook._xlsb_layout",
    "xlspy.workbook._xlsb_loaded",
    "xlspy.workbook._xlsb_sheet_meta",
]
disallow_untyped_defs = false
disallow_incomplete_defs = false

# Architectural contracts, run with `lint-imports` (see .github/workflows/ci.yml).
# The core model and the facade are the stable inner layers; format I/O and
# updaters are allowed to depend on them, never the other way around.
[tool.importlinter]
root_packages = ["xlspy"]

[[tool.importlinter.contracts]]
name = "The core workbook model does not directly import the I/O facades"
type = "forbidden"
# The save path is reached lazily from Workbook.save(); the model itself must
# not import a reader, writer or updater at module level.
allow_indirect_imports = true
source_modules = [
    "xlspy.workbook._worksheet",
    "xlspy.workbook._workbook",
    "xlspy.workbook._model",
    "xlspy.workbook._tables",
]
forbidden_modules = [
    "xlspy.reader",
    "xlspy.writer",
    "xlspy.xlsx_writer",
    "xlspy.xlsx_updater",
    "xlspy.xlsb_updater",
]

[[tool.importlinter.contracts]]
name = "Internal modules do not import the public facade"
type = "forbidden"
source_modules = ["xlspy.*", "xlspy.workbook.*"]
forbidden_modules = ["xlspy"]

[[tool.importlinter.contracts]]
name = "Readers, writers and updaters do not import the workbook model"
type = "forbidden"
allow_indirect_imports = true
source_modules = [
    "xlspy.reader",
    "xlspy.writer",
    "xlspy.xlsx_writer",
    "xlspy.xlsx_updater",
    "xlspy.xlsb_updater",
    "xlspy._xlsx_edit",
    "xlspy._xlsb_edit",
    "xlspy._xlsx_sheets",
    "xlspy._xlsb_sheets",
]
forbidden_modules = ["xlspy.workbook"]

[[tool.importlinter.contracts]]
name = "XLSB modules do not depend on XLSX modules"
type = "forbidden"
allow_indirect_imports = true
source_modules = [
    "xlspy._xlsb_cf",
    "xlspy._xlsb_edit",
    "xlspy._xlsb_formulas",
    "xlspy._xlsb_functions",
    "xlspy._xlsb_ignored_errors",
    "xlspy._xlsb_pivots",
    "xlspy._xlsb_print",
    "xlspy._xlsb_sheets",
    "xlspy._xlsb_slicers",
    "xlspy._xlsb_sort",
    "xlspy._xlsb_sparklines",
    "xlspy._xlsb_style_records",
    "xlspy._xlsb_table_part",
    "xlspy._xlsb_writer",
    "xlspy._xlsb_writer_bin",
    "xlspy._xlsb_writer_consts",
    "xlspy._xlsb_writer_host",
    "xlspy._xlsb_writer_sheet",
    "xlspy._xlsb_writer_strings",
    "xlspy._xlsb_writer_styles",
    "xlspy._xlsb_writer_views",
    "xlspy.workbook._xlsb_chartsheets",
    "xlspy.workbook._xlsb_drawings",
    "xlspy.workbook._xlsb_layout",
    "xlspy.workbook._xlsb_loaded",
    "xlspy.workbook._xlsb_sheet_meta",
    "xlspy.workbook._xlsb_styles",
    "xlspy.workbook._xlsb_tables",
]
forbidden_modules = [
    "xlspy._xlsx_edit",
    "xlspy._xlsx_sheets",
    "xlspy._xlsx_writer_host",
    "xlspy._xlsx_writer_parts",
    "xlspy._xlsx_writer_sheet",
    "xlspy._xlsx_writer_sheet_xml",
    "xlspy._xlsx_writer_styles",
    "xlspy._xlsx_writer_xml",
    "xlspy.xlsx_writer",
    "xlspy.xlsx_updater",
]
