[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

# The native accelerator: rust/xlspy_core, a PyO3 module (see _accel.py).
[tool.maturin]
python-source = "src"
module-name = "xlspy._rs_core"
manifest-path = "rust/xlspy_core/Cargo.toml"
# Not in Cargo.toml, so `cargo test` links against libpython.
features = ["pyo3/extension-module"]
# Editable installs would otherwise build the debug profile (several times slower).
profile = "release"

[project]
name = "xlspy"
version = "0.10.1"
authors = [
  { name="Krzysztof Duśko"},
]
description = "Read and write XLSB and XLSX files efficiently, including XLSM updates."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Rust",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Office Suites",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
]

[project.urls]
Repository = "https://github.com/justybase/xlspy/"

[project.optional-dependencies]
pandas = [
    "pandas>=2.0",
]
polars = [
    "polars>=1.0",
]
test = [
    "openpyxl>=3.1,<3.2",
    "pandas",
    "polars",
    "pytest",
    "pytest-cov",
    "pytest-randomly",
    "hypothesis",
    "psutil",
    "xlsxwriter",
]
examples = [
    "memory-profiler"
]

[tool.cibuildwheel]
build = "cp311-* cp312-* cp313-* cp314-* cp315-*"
archs = "auto64"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "com: requires Microsoft Excel via COM; skipped unless XLSPY_RUN_EXCEL_COM=1",
    "printer: reads or sets Excel's PageSetup, which needs a reachable default printer; skipped unless XLSPY_RUN_EXCEL_PRINT=1",
    "compat: openpyxl compatibility harness and golden workbooks (tests/openpyxl_compat)",
]
filterwarnings = [
    "error",
]

[tool.coverage.run]
source = ["src/xlspy"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
# Baseline (Linux, Python 3.12, with pandas/polars installed) is ~87% branch
# coverage; the threshold leaves headroom for platform differences.
fail_under = 84
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    'raise (NotImplementedError|UnsupportedFeatureError)\b',
]

[tool.ruff]
src = ["src"]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
# Correctness checks: syntax errors, undefined names, unused imports and
# variables, plus rules that report nothing (or were fixed to report nothing).
# Not enabled yet: B905 (zip strict=, changes behavior for unequal lengths),
# B007 (unused loop variables; some are read after the loop), E/S/ARG/DTZ.
select = [
    "E9", "F63", "F7", "F82", "F401", "F811", "F841",
    "PLE", "PIE", "TRY203", "C4", "RET", "B010", "B023",
]

[tool.ruff.lint.per-file-ignores]
"src/xlspy/__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.11"
files = ["src/xlspy"]
mypy_path = ["src"]
ignore_missing_imports = true
warn_unused_configs = true

# Modules that still have type errors (2026-10-29 baseline). New modules are
# checked; remove a module from this list once mypy passes for it.
[[tool.mypy.overrides]]
module = [
    "xlspy.xlsx_writer",
]
ignore_errors = true
