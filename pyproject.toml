[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

# The native accelerator: rust/xlspy_core, a PyO3 module (see _accel.py).
[tool.maturin]
python-source = "src"
module-name = "xlspy._rs_core"
manifest-path = "rust/xlspy_core/Cargo.toml"
# Not in Cargo.toml, so `cargo test` links against libpython.
features = ["pyo3/extension-module"]
# Editable installs would otherwise build the debug profile (several times slower).
profile = "release"

[project]
name = "xlspy"
version = "0.10.1"
authors = [
  { name="Krzysztof Duśko"},
]
description = "Read and write XLSB and XLSX files efficiently, including XLSM updates."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Rust",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Office Suites",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
]

[project.urls]
Repository = "https://github.com/justybase/xlspy/"

[project.optional-dependencies]
pandas = [
    "pandas>=2.0",
]
polars = [
    "polars>=1.0",
]
test = [
    "openpyxl==3.1.5",  # the openpyxl_compat goldens were made with it
    "pandas",
    "polars",
    "pytest",
    "pytest-cov",
    "pytest-randomly",
    "pytest-timeout",
    "hypothesis",
    "psutil",
    "pyxlsb",  # a second XLSB reader (tests/test_xlsb_interop.py)
    "xlsxwriter",
]
examples = [
    "memory-profiler"
]
# The guide and API reference site (mkdocs.yml); CI installs the same versions.
docs = [
    "mkdocs>=1.6",
    "mkdocstrings[python]>=0.26",
]

# The architectures come from the runner (CIBW_ARCHS in .github/workflows/publish.yml).
[tool.cibuildwheel]
build = "cp311-* cp312-* cp313-* cp314-* cp315-*"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers --strict-config"
# A hung test (an Excel dialog, a native loop) fails instead of stalling CI.
timeout = 300
markers = [
    "com: requires Microsoft Excel via COM; skipped unless XLSPY_RUN_EXCEL_COM=1",
    "printer: reads or sets Excel's PageSetup, which needs a reachable default printer; skipped unless XLSPY_RUN_EXCEL_PRINT=1",
    "libreoffice: converts output with headless LibreOffice; skipped when soffice is not found",
    "compat: openpyxl compatibility harness and golden workbooks (tests/openpyxl_compat)",
]
filterwarnings = [
    "error",
]

[tool.coverage.run]
source = ["src/xlspy"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
# CI combines a native run and an XLSPY_ACCEL=python run. Both together reach
# 90% branch coverage (2026-11-02, with pandas/polars installed); the floor is
# one point under that.
fail_under = 89
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    'raise (NotImplementedError|UnsupportedFeatureError)\b',
]

[tool.ruff]
src = ["src"]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
# Correctness checks: syntax errors, undefined names, unused imports and
# variables, plus rules that report nothing (or were fixed to report nothing).
# UP keeps the syntax current for Python 3.11 (builtin generics, X | None).
# Not enabled yet: B905 (zip strict=, changes behavior for unequal lengths),
# B007 (unused loop variables; some are read after the loop), E/S/ARG/DTZ.
select = [
    "E9", "F63", "F7", "F82", "F401", "F811", "F841",
    "PLE", "PIE", "TRY203", "C4", "RET", "B010", "B023", "UP", "I002",
]
# printf-style formatting is fine where it is used.
ignore = ["UP031"]

[tool.ruff.lint.isort]
# Annotations are never evaluated at runtime in the package (I002 adds the import).
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.per-file-ignores]
"src/xlspy/__init__.py" = ["F401"]
"{tests,tools,benchmarks,examples}/**" = ["I002"]
# The lambdas read Excel COM properties and are called at once, inside the loop.
"tests/test_excel_com_xlsb_parity.py" = ["B023"]

[tool.mypy]
python_version = "3.11"
files = ["src/xlspy"]
mypy_path = ["src"]
ignore_missing_imports = true
warn_unused_configs = true
# Check the bodies of unannotated functions too; without this, mypy skips them.
check_untyped_defs = true
warn_unused_ignores = true
strict_equality = true
warn_return_any = true
no_implicit_reexport = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

# Not yet fully annotated: the bodies are still checked (check_untyped_defs), but
# a def may lack parameter or return types. Every other module, and every new one,
# must annotate each def. Remove a module from this list once it passes.
[[tool.mypy.overrides]]
module = [
    "xlspy._accel",
    "xlspy._metadata",
    "xlspy._output",
    "xlspy._safe_xml",
    "xlspy._widths",
    "xlspy._writer_common",
    "xlspy._xlsb_cf",
    "xlspy._xlsb_edit",
    "xlspy._xlsb_formulas",
    "xlspy._xlsb_metadata",
    "xlspy._xlsb_read",
    "xlspy._xlsb_sheets",
    "xlspy._xlsb_validation",
    "xlspy._xlsb_writer_parts",
    "xlspy._xlsx_edit",
    "xlspy._xlsx_read",
    "xlspy._xlsx_writer_sheet",
    "xlspy._xlsx_writer_sheet_xml",
    "xlspy._xlsx_writer_styles",
    "xlspy._zip_threads",
    "xlspy.biff_reader",
    "xlspy.chart_parts",
    "xlspy.chart_reader",
    "xlspy.charts",
    "xlspy.comments",
    "xlspy.data_validation",
    "xlspy.external_links",
    "xlspy.formula.token",
    "xlspy.formula.translate",
    "xlspy.ignored_errors",
    "xlspy.images",
    "xlspy.outline",
    "xlspy.pivots",
    "xlspy.printing",
    "xlspy.rich_text",
    "xlspy.styles._attrs",
    "xlspy.styles._cf_rules",
    "xlspy.styles._keys",
    "xlspy.styles._ranges",
    "xlspy.styles._tables",
    "xlspy.updater_utils",
    "xlspy.utils.cell",
    "xlspy.utils.datetime",
    "xlspy.utils.units",
    "xlspy.workbook._cell",
    "xlspy.workbook._chartsheets",
    "xlspy.workbook._drawings",
    "xlspy.workbook._fast_sheet",
    "xlspy.workbook._loaded",
    "xlspy.workbook._objects",
    "xlspy.workbook._properties",
    "xlspy.workbook._props",
    "xlspy.workbook._reader",
    "xlspy.workbook._shift",
    "xlspy.workbook._styles",
    "xlspy.workbook._tables",
    "xlspy.workbook._writer",
    "xlspy.workbook._xlsb_layout",
    "xlspy.workbook._xlsb_loaded",
    "xlspy.workbook._xlsb_reader",
    "xlspy.workbook._xlsb_sheet_meta",
]
disallow_untyped_defs = false
disallow_incomplete_defs = false
