[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[[tool.setuptools.ext-modules]]
name = "xlspy._c_core"
sources = ["src/xlspy/c_ext/_c_core.c"]

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "xlspy"
version = "0.8.1"
authors = [
  { name="Krzysztof Duśko"},
]
description = "Read and write XLSB and XLSX files efficiently, including XLSM updates."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Office Suites",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
]

[project.urls]
Repository = "https://github.com/justybase/xlspy/"

[project.optional-dependencies]
pandas = [
    "pandas>=2.0",
]
polars = [
    "polars>=1.0",
]
test = [
    "openpyxl",
    "pandas",
    "polars",
    "pytest",
    "pytest-cov",
    "pytest-randomly",
    "hypothesis",
    "xlsxwriter",
]
examples = [
    "memory-profiler"
]

[tool.cibuildwheel]
build = "cp312-* cp313-* cp314-*"
archs = "auto64"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "slow: longer-running tests (skipped by default only with -m 'not slow')",
    "com: requires Microsoft Excel via COM (set XLSPY_RUN_EXCEL_COM=1)",
]
filterwarnings = [
    "error",
]

[tool.coverage.run]
source = ["src/xlspy"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
# Baseline (Linux, Python 3.12, with pandas/polars installed) is ~87% branch
# coverage; the threshold leaves headroom for platform differences.
fail_under = 84
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
