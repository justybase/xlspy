[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[[tool.setuptools.ext-modules]]
name = "xlspy._c_core"
sources = ["src/xlspy/c_ext/_c_core.c"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
xlspy = ["py.typed"]

[project]
name = "xlspy"
version = "0.11.0"
authors = [
  { name="Krzysztof Duśko"},
]
description = "Read and write XLSB and XLSX files efficiently, including XLSM updates."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Office Suites",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
]

[project.urls]
Repository = "https://github.com/justybase/xlspy/"

[project.optional-dependencies]
pandas = [
    "pandas>=2.0",
]
polars = [
    "polars>=1.0",
]
test = [
    "openpyxl>=3.1,<3.2",
    "pandas",
    "polars",
    "pytest",
    "pytest-cov",
    "pytest-randomly",
    "hypothesis",
    "xlsxwriter",
]
examples = [
    "memory-profiler"
]

[tool.cibuildwheel]
build = "cp312-* cp313-* cp314-*"
archs = "auto64"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "slow: longer-running tests (skipped by default only with -m 'not slow')",
    "com: requires Microsoft Excel via COM (set XLSPY_RUN_EXCEL_COM=1)",
    "printer: reads or sets Excel's PageSetup, which needs a reachable default printer (set XLSPY_RUN_EXCEL_PRINT=1)",
    "compat: openpyxl compatibility harness and golden workbooks",
]
filterwarnings = [
    "error",
]

[tool.coverage.run]
source = ["src/xlspy"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
# Baseline (Linux, Python 3.12, with pandas/polars installed) is ~87% branch
# coverage; the threshold leaves headroom for platform differences.
fail_under = 84
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
src = ["src"]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
# Correctness checks only: syntax errors, undefined names, unused imports
# and variables. Style is left to review.
select = ["E9", "F63", "F7", "F82", "F401", "F811", "F841"]

[tool.ruff.lint.per-file-ignores]
"src/xlspy/__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.12"
files = ["src/xlspy"]
ignore_missing_imports = true
warn_unused_configs = true

# Modules that still have type errors (2026-10-29 baseline). New modules are
# checked; remove a module from this list once mypy passes for it.
[[tool.mypy.overrides]]
module = [
    "xlspy._accel",
    "xlspy._metadata",
    "xlspy._output",
    "xlspy._widths",
    "xlspy._xlsb_cf",
    "xlspy._xlsb_edit",
    "xlspy._xlsb_sheets",
    "xlspy._xlsb_style_records",
    "xlspy._xlsb_styles",
    "xlspy._xlsb_validation",
    "xlspy._xlsb_writer",
    "xlspy._xlsx_edit",
    "xlspy.biff_reader",
    "xlspy.chart_reader",
    "xlspy.data_validation",
    "xlspy.doc_properties",
    "xlspy.images",
    "xlspy.reader",
    "xlspy.rich_text",
    "xlspy.styles.core",
    "xlspy.styles.numbers",
    "xlspy.updater_utils",
    "xlspy.utils.cell",
    "xlspy.workbook._fast_sheet",
    "xlspy.workbook._loaded",
    "xlspy.workbook._model",
    "xlspy.workbook._objects",
    "xlspy.workbook._print",
    "xlspy.workbook._reader",
    "xlspy.workbook._shift",
    "xlspy.workbook._styles",
    "xlspy.workbook._xlsb_layout",
    "xlspy.workbook._xlsb_loaded",
    "xlspy.workbook._xlsb_reader",
    "xlspy.workbook._xlsb_sheet_meta",
    "xlspy.writer",
    "xlspy.xlsb_updater",
    "xlspy.xlsx_updater",
    "xlspy.xlsx_writer",
]
ignore_errors = true
