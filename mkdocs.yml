# The guide and the API reference. Build: pip install -e .[docs] && zensical build --clean --strict
site_name: xlspy
site_description: Fast XLSB/XLSX reader and writer for Python
site_url: https://justybase.github.io/xlspy/
repo_url: https://github.com/justybase/xlspy
docs_dir: docs
site_dir: site
theme:
  variant: modern
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: lucide/sun
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: lucide/moon
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.path
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Guide:
      - Overview: usage.md
      - Writing workbooks: guide/writing.md
      - Formatting and layout: guide/styling.md
      - Formulas, charts and other objects: guide/objects.md
      - pandas and polars DataFrames: guide/dataframes.md
      - Updating existing workbooks: guide/updating.md
      - Reading workbooks: guide/reading.md
      - The workbook model: guide/model.md
  - API reference:
      - Overview: api/index.md
      - Writing: api/writing.md
      - Reading: api/reading.md
      - Updating: api/updating.md
      - Workbook model: api/model.md
      - Styles and formatting: api/styles.md
      - Charts and other objects: api/objects.md
      - Errors: api/errors.md
  - Architecture: architecture.md
  - Benchmarks: benchmarks.md
  - openpyxl parity: openpyxl-parity.md
  - Validation: validation.md

validation:
  invalid_links: true
  invalid_link_anchors: true

plugins:
  - search
  - llmstxt:
      sections:
        Home:
          - index.md
        Guide:
          - usage.md
          - guide/*.md
        API:
          - api/*.md
        Project:
          - architecture.md
          - benchmarks.md
          - openpyxl-parity.md
          - validation.md
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            members_order: source
            filters: ["!^_"]
            inherited_members: true
            merge_init_into_class: true
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            heading_level: 2
