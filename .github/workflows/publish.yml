name: Publish to PyPI

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Read-only by default; the publish job alone requests an OIDC token.
permissions:
  contents: read

jobs:
  check-version:
    name: Tag matches the package version
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Compare the tag with pyproject.toml
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import sys
          import tomllib

          with open("pyproject.toml", "rb") as handle:
              version = tomllib.load(handle)["project"]["version"]
          print("pyproject.toml version:", version)
          if os.environ["REF_TYPE"] == "tag":
              tag = os.environ["REF_NAME"].removeprefix("v")
              if tag != version:
                  sys.exit(f"tag v{tag} does not match pyproject.toml version {version}")
          PY

  tests:
    name: Test suite before building
    needs: check-version
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install the package with test deps and run the tests
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
          python -m pytest tests/ -q --tb=short

  build-wheels:
    name: Build wheels on ${{ matrix.os }} (${{ matrix.archs }})
    needs: tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            archs: auto64
          - os: ubuntu-24.04-arm
            archs: aarch64
          - os: windows-latest
            archs: AMD64
          - os: windows-11-arm
            archs: ARM64
          - os: macos-latest
            archs: arm64
          - os: macos-15-intel
            archs: x86_64

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel

      - name: Build wheels
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_ARCHS: ${{ matrix.archs }}
          # The manylinux/musllinux containers have no Rust toolchain.
          CIBW_BEFORE_ALL_LINUX: "curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal"
          CIBW_ENVIRONMENT_LINUX: 'PATH="$HOME/.cargo/bin:$PATH"'
          CIBW_TEST_COMMAND: "python {project}/tools/wheel_smoke.py"

      - uses: actions/upload-artifact@v6
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.archs }}
          path: ./wheelhouse/*.whl

  build-sdist:
    name: Build sdist
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install build
        run: python -m pip install build

      - name: Build sdist
        run: python -m build --sdist --outdir wheelhouse

      - uses: actions/upload-artifact@v6
        with:
          name: wheels-sdist
          path: ./wheelhouse/*.tar.gz

  test-sdist:
    name: Install the sdist into a clean venv
    needs: build-sdist
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v7
        with:
          name: wheels-sdist
          path: ./dist

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build and install the sdist in a clean venv
        run: |
          python -m venv "$RUNNER_TEMP/sdist-venv"
          "$RUNNER_TEMP/sdist-venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/sdist-venv/bin/python" -m pip install dist/*.tar.gz

      - name: Smoke-test the installed sdist
        run: |
          "$RUNNER_TEMP/sdist-venv/bin/python" tools/wheel_smoke.py

  publish:
    name: Upload to PyPI
    needs: [build-wheels, test-sdist]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: wheels-*
          merge-multiple: true
          path: ./dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
