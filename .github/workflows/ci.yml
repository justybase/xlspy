name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]

    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/xlspy_core

      - name: Install package with test deps (builds the Rust extension)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Verify the native extension is loaded
        run: |
          python -c "from xlspy._accel import HAVE_NATIVE, ACCEL_BACKEND; print('native:', HAVE_NATIVE, ACCEL_BACKEND); assert HAVE_NATIVE and set(ACCEL_BACKEND.values()) == {'rust'}, 'native extension not loaded!'"

      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy

      - name: Ruff
        run: |
          ruff check src

      - name: Mypy
        run: |
          mypy

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/xlspy_core

      - name: Rustfmt, Clippy and unit tests
        working-directory: rust/xlspy_core
        run: |
          rustup component add rustfmt clippy
          cargo fmt --check
          cargo clippy --release --all-targets -- -D warnings
          cargo test --release

  test-fallback:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/xlspy_core

      - name: Install package with test deps (the extension is built but disabled below)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run tests with the native extension disabled
        run: |
          XLSPY_ACCEL=python python -m pytest tests/ -v --tb=short

      - name: Verify the native extension is disabled
        run: |
          XLSPY_ACCEL=python python -c "from xlspy._accel import HAVE_NATIVE; print('native:', HAVE_NATIVE); assert not HAVE_NATIVE, 'native extension should be disabled!'"
          XLSPY_DISABLE_C_EXT=1 python -c "from xlspy._accel import HAVE_NATIVE; assert not HAVE_NATIVE, 'XLSPY_DISABLE_C_EXT=1 should still disable it'"

  compat:
    name: openpyxl compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/xlspy_core

      - name: Install package with test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
          pip install "openpyxl==3.1.5"

      - name: Run the compatibility harness
        run: python -m pytest tests/openpyxl_compat -v --tb=short

  wheel-smoke:
    name: Wheel smoke test (installed wheel, clean venv)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/xlspy_core

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist

      - name: Install the wheel into a clean venv
        run: |
          python -m venv .venv-smoke
          .venv-smoke/bin/python -m pip install --upgrade pip
          .venv-smoke/bin/python -m pip install dist/*.whl pytest

      - name: Smoke-test the installed wheel
        run: .venv-smoke/bin/python tools/wheel_smoke.py

      - name: Run core tests against the installed wheel
        run: |
          smoke="$RUNNER_TEMP/wheel-smoke"
          mkdir -p "$smoke"
          cp tests/test_reader.py tests/test_updaters.py tests/test_streaming_updaters.py \
             tests/test_output_integrity.py tests/conftest.py tests/zip_utils.py "$smoke/"
          cd "$smoke"
          "$GITHUB_WORKSPACE/.venv-smoke/bin/python" -m pytest -q

  deps-floor:
    name: Dependency floor (pandas 2.1, polars 1.0)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/xlspy_core

      - name: Install package with test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Downgrade to the oldest supported pandas / polars
        run: |
          pip install "numpy<2" "pandas==2.1.*" "polars==1.0.*"

      - name: Verify floor versions
        run: |
          python -c "import numpy, pandas, polars; print('numpy', numpy.__version__); print('pandas', pandas.__version__); print('polars', polars.__version__)"
          python - <<'PY'
          import pandas, polars
          assert pandas.__version__.startswith("2.1."), pandas.__version__
          assert polars.__version__.startswith("1.0."), polars.__version__
          PY

      - name: Run tests
        run: python -m pytest tests/ -q --tb=short

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/xlspy_core

      - name: Install package with test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run tests with coverage
        run: python -m pytest tests/ -q --cov --cov-report=term --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-xml
          path: coverage.xml
