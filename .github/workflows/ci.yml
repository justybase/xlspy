name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]

    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/xlspy_core

      - name: Install package with test deps (builds the Rust extension)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Verify the native extension is loaded
        run: |
          python -c "from xlspy._accel import HAVE_NATIVE, ACCEL_BACKEND; print('native:', HAVE_NATIVE, ACCEL_BACKEND); assert HAVE_NATIVE and set(ACCEL_BACKEND.values()) == {'rust'}, 'native extension not loaded!'"

      - name: Check the native stub against the built module
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: |
          python -m pip install mypy
          python -m mypy.stubtest xlspy._rs_core

      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy

      - name: Ruff
        run: |
          ruff check src tests tools benchmarks examples

      - name: Mypy (oldest and newest stable Python)
        run: |
          mypy
          mypy --python-version 3.14

      - name: "Mypy: stub usage (accepted and rejected argument types)"
        run: |
          mypy --warn-unused-ignores tests/typing/stub_usage.py

  docs:
    # The guide and the API reference build without warnings. mkdocstrings reads
    # the sources statically, so the package (and its Rust module) is not built.
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install mkdocs (the versions of the docs extra)
        run: |
          python -m pip install --upgrade pip
          pip install "mkdocs>=1.6" "mkdocstrings[python]>=0.26"

      - name: Build
        run: mkdocs build --strict

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/xlspy_core

      - name: Rustfmt, Clippy and unit tests
        working-directory: rust/xlspy_core
        # Some unit tests embed Python (pyseq.rs, text.rs): the test binary loads
        # the libpython of setup-python.
        env:
          LD_LIBRARY_PATH: ${{ env.pythonLocation }}/lib
        run: |
          rustup component add rustfmt clippy
          cargo fmt --check
          cargo clippy --release --locked --all-targets -- -D warnings
          cargo test --release --locked

  msrv:
    name: Rust 1.88 (rust-version in Cargo.toml)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - name: Set up Rust 1.88
        uses: dtolnay/rust-toolchain@1.88

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/xlspy_core

      - name: Check the crate builds on the minimum supported Rust
        working-directory: rust/xlspy_core
        run: cargo check --release --locked

  audit:
    name: Cargo audit (RustSec advisories)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Audit the Rust dependencies
        working-directory: rust/xlspy_core
        run: cargo audit

  rust-coverage:
    name: Coverage of the native module (cargo llvm-cov)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/xlspy_core

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Install the test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      # The Rust unit tests and the pytest suite against an instrumented build
      # of xlspy._rs_core (a copy of the package; the installed module is not
      # touched). Reported only: no threshold yet.
      - name: Measure
        run: |
          python tools/rust_coverage.py --lcov | tee rust-coverage.txt
          { echo '```'; sed -n '/^Filename/,/^TOTAL/p' rust-coverage.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the report
        uses: actions/upload-artifact@v6
        with:
          name: rust-coverage
          path: build/rust-coverage/lcov.info

  test-fallback:
    name: Pure-Python fallback (${{ matrix.os }}, ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.14"]

    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}/src

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install test dependencies without building the package
        run: |
          python -m pip install --upgrade pip
          python -c 'import pathlib, subprocess, sys, tomllib; deps=tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["optional-dependencies"]["test"]; subprocess.check_call([sys.executable, "-m", "pip", "install", *deps])'

      - name: Check the native extension is disabled
        env:
          XLSPY_ACCEL: python
        run: python -c "import sys; sys.path.insert(0, 'src'); from xlspy._accel import HAVE_NATIVE; print('native:', HAVE_NATIVE); assert not HAVE_NATIVE, 'native extension should be disabled!'"

      - name: Run tests with the native extension disabled
        env:
          XLSPY_ACCEL: python
        run: python -m pytest tests/ -v --tb=short

  wheel-smoke:
    name: Wheel smoke test (installed wheel, clean venv)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/xlspy_core

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist

      - name: Install the wheel into a clean venv
        run: |
          python -m venv .venv-smoke
          .venv-smoke/bin/python -m pip install --upgrade pip
          .venv-smoke/bin/python -m pip install dist/*.whl pytest

      - name: Smoke-test the installed wheel
        run: .venv-smoke/bin/python tools/wheel_smoke.py

      - name: Run core tests against the installed wheel
        # The same subset cibuildwheel runs on every wheel (publish.yml).
        run: .venv-smoke/bin/python tools/wheel_tests.py "$GITHUB_WORKSPACE"

  sdist:
    name: Sdist builds and installs into a clean venv
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build the sdist and install it in a clean venv
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist --outdir dist
          python -m venv "$RUNNER_TEMP/sdist-venv"
          "$RUNNER_TEMP/sdist-venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/sdist-venv/bin/python" -m pip install dist/*.tar.gz

      - name: Smoke-test the installed sdist
        run: |
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/sdist-venv/bin/python" "$GITHUB_WORKSPACE/tools/wheel_smoke.py"

  deps-floor:
    name: Dependency floor (pandas 2.1, polars 1.0)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/xlspy_core

      - name: Install package with test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Downgrade to the oldest supported pandas / polars
        run: |
          pip install "numpy<2" "pandas==2.1.*" "polars==1.0.*"

      - name: Verify floor versions
        run: |
          python -c "import numpy, pandas, polars; print('numpy', numpy.__version__); print('pandas', pandas.__version__); print('polars', polars.__version__)"
          python - <<'PY'
          import pandas, polars
          assert pandas.__version__.startswith("2.1."), pandas.__version__
          assert polars.__version__.startswith("1.0."), polars.__version__
          PY

      - name: Run tests
        run: python -m pytest tests/ -q --tb=short

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/xlspy_core

      - name: Install package with test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      # Both backends: the native run covers the dispatch, the pure-Python run the
      # fallbacks the native extension replaces. The floor is fail_under in
      # [tool.coverage.report]; the report step fails below it.
      - name: Run tests with coverage (native)
        run: python -m pytest tests/ -q --cov --cov-report=

      - name: Run tests with coverage (pure Python)
        env:
          XLSPY_ACCEL: python
        run: python -m pytest tests/ -q --cov --cov-append --cov-report=

      - name: Coverage report (both backends)
        run: |
          python -m coverage report
          python -m coverage xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-xml
          path: coverage.xml
