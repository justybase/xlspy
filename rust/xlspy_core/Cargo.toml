[package]
name = "xlspy_core"
version = "0.1.0"
edition = "2024"
# Lowest toolchain that builds the crate (let-chains, as_chunks_mut); checked in CI.
rust-version = "1.88"
publish = false
description = "Native accelerator for xlspy (PyO3 port of the former C extension)"

[lib]
name = "_rs_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = "0.30"
memchr = "2"

[profile.release]
lto = "fat"
codegen-units = 1
# Unwind, not abort: a panic in a reader becomes a PanicException in Python
# instead of killing the interpreter.
panic = "unwind"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
